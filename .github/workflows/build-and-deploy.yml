name: Build SubArabify & Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Prepare GitHub Pages site
        run: |
          mkdir -p public
          cp docs/index.html public/index.html
          cp docs/icon.jpg public/icon.jpg
          cp app/build/outputs/apk/release/*.apk public/SubArabify-latest.apk
          cp public/SubArabify-latest.apk "public/SubArabify-1.0.3-beta.apk"
          zip -r public/subarabify-jellyfin-addon-1.0.3-beta.zip jellyfin-addon \
            -x 'jellyfin-addon/.cache/*' 'jellyfin-addon/__pycache__/*'

      - name: Self-test Jellyfin addon core
        run: |
          python3 jellyfin-addon/test_srtcore.py
          python3 jellyfin-addon/test_stt.py

      - name: Publish Jellyfin repository manifest (real checksum + timestamp)
        run: |
          python3 - <<'EOF'
          import hashlib, datetime, pathlib
          zf = pathlib.Path("public/subarabify-jellyfin-addon-1.0.3-beta.zip")
          sha = hashlib.sha256(zf.read_bytes()).hexdigest()
          ts = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          tpl = pathlib.Path("jellyfin-addon/manifest.json").read_text(encoding="utf-8")
          out = tpl.replace("__CHECKSUM__", sha).replace("__TIMESTAMP__", ts)
          assert "__" not in out.split('"checksum"')[1].split('"')[1], "checksum placeholder not filled"
          pathlib.Path("public/jellyfin-manifest.json").write_text(out, encoding="utf-8")
          print("jellyfin-manifest.json sha256:", sha)
          print("timestamp:", ts)
          EOF

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
