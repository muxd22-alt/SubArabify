name: Build SubArabify & Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Self-test Python client (srtcore + routing/backend client)
        run: |
          python3 -m pip install -q requests
          python3 client/test_srtcore.py
          python3 client/test_client.py

      - name: Self-test Jellyfin addon (config/QR/LAN endpoint/routing)
        run: |
          python3 -m pip install -q requests "qrcode[pil]"
          python3 jellyfin-addon/test_addon.py

      - name: Prepare GitHub Pages site
        run: |
          mkdir -p public
          cp docs/index.html public/index.html
          cp docs/icon.jpg public/icon.jpg
          cp app/build/outputs/apk/release/*.apk public/SubArabify-latest.apk
          cp "public/SubArabify-latest.apk" "public/SubArabify-0.2.3-alpha.apk"
          zip -r public/subarabify-jellyfin-addon-0.2.3-alpha.zip \
            jellyfin-addon/subarabify_jellyfin.py \
            jellyfin-addon/srtcore.py \
            jellyfin-addon/config.json \
            jellyfin-addon/requirements.txt \
            jellyfin-addon/run-termux.sh \
            jellyfin-addon/README.md
          python3 jellyfin-addon/make_manifest.py public/subarabify-jellyfin-addon-0.2.3-alpha.zip

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4