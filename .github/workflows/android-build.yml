name: Build Android APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7

    - name: Build with Gradle
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SubArabify-Helper-APK
        path: app/build/outputs/apk/debug/app-debug.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Rename APK
        run: |
          SAFE_REF=$(echo "${{ github.ref_name }}" | tr '/' '_')
          echo "SAFE_REF=${SAFE_REF}" >> $GITHUB_ENV
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/SubArabify_${SAFE_REF}.apk"
        
      - name: Release APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: release-${{ github.run_number }}
          files: app/build/outputs/apk/release/SubArabify_${{ env.SAFE_REF }}.apk
          prerelease: true
          generate_release_notes: true
          name: "ساب أرابيفاي ${{ env.SAFE_REF }} (Build ${{ github.run_number }})"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
